name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

# Cancel in-progress runs for the same ref when a new push lands.
# Each PR / branch gets its own group so concurrent unrelated work is
# unaffected.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Job-name convention: `<Tool> (PHP X.Y[, Magento Z.A.B])`.
# Tool name first so checks group naturally in the UI.

jobs:
  # dev/magento-support-matrix.sh is vendored byte-for-byte from the vanilla
  # two-inc/magento-plugin repo (its `staging` branch is the source of truth —
  # TWO-24998). This job fails CI red if the local copy has drifted, so the
  # classifier can't silently rot across the three repos that share it.
  matrix-script-parity:
    name: Matrix-script parity
    runs-on: ${{ vars.RUNNER_STANDARD }}
    steps:
      - uses: actions/checkout@v7
      - name: Check classifier matches the canonical copy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./dev/matrix-script-parity.sh

  base-tile-copy-parity:
    name: Base tile-copy parity
    runs-on: ${{ vars.RUNNER_STANDARD }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the base still declares the delegated methods
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Invoked through bash: a Windows-side edit of a WSL file strips the
        # execute bit, and `./script` then exits 126 — a guard that never ran,
        # indistinguishable on the dashboard from one that ran and failed.
        run: bash dev/base-tile-copy-parity.sh

  base-cache-tag-parity:
    name: Base cache-tag parity
    runs-on: ${{ vars.RUNNER_STANDARD }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the stub's cache tag matches the base constant
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Invoked through bash for the same reason as the job above.
        run: bash dev/base-cache-tag-parity.sh

  # Discovers the current Magento support window from upstream so the
  # PHPStan / DI-compile / lint matrices track Adobe's lifecycle without
  # hand-maintenance. `dev/magento-support-matrix.sh` is the single
  # source of truth for which Magento × PHP combinations CI exercises.
  discover-magento-matrix:
    name: Discover Magento support matrix
    runs-on: ${{ vars.RUNNER_STANDARD }}
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      php_lint_matrix: ${{ steps.gen.outputs.php_lint_matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: gen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # One classification, sliced three ways (--emit-all) so run/skip/lint
          # are mutually consistent and we hit upstream + Docker Hub once, not 3x.
          all=$(./dev/magento-support-matrix.sh --emit-all)
          matrix=$(echo "$all" | jq -c '.matrix')
          skips=$(echo "$all" | jq -c '.skips')
          php_lint_matrix=$(echo "$all" | jq -c '.php_lint')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "php_lint_matrix=$php_lint_matrix" >> "$GITHUB_OUTPUT"
          echo "Runnable PHPStan / DI-compile matrix:"
          echo "$matrix" | jq .
          echo "Skipped (NOT tested) combinations:"
          echo "$skips" | jq .
          echo "Generated PHP lint matrix:"
          echo "$php_lint_matrix" | jq .

          # The run/skip decision is made HERE, at matrix-assembly time — the
          # test jobs only ever receive runnable combos, so a green test leg
          # always means "tested" (TWO-24998). Untestable combos never become
          # green legs; instead they are surfaced two ways that read clearly as
          # "not run" at a glance:
          #   1. a coverage table in this job's step summary, and
          #   2. one ::warning:: annotation per skipped combo (yellow, shown on
          #      the run summary — distinct from a green pass).
          {
            echo "## Magento × PHP version coverage"
            echo ""
            echo "| Magento | PHP | Status | Reason |"
            echo "|---|---|---|---|"
            echo "$matrix" | jq -r '.[] | "| \(.magento) | \(.php) | ✅ tested | |"'
            echo "$skips"  | jq -r '.[] | "| \(.magento) | \(.php) | 🚫 NOT run | \(.skip_reason) |"'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$skips" | jq -r '.[]
            | "::warning title=Combination NOT tested::\(.magento) / PHP \(.php) — \(.skip_reason)"'

  lint:
    name: Lint (PHP ${{ matrix.php }})
    needs: discover-magento-matrix
    runs-on: ${{ vars.RUNNER_STANDARD }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover-magento-matrix.outputs.php_lint_matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - name: Lint PHP files
        # Test/ is excluded — tests are dev-only and use newer syntax
        # than the merchant runtime. The phpunit matrix already
        # exercises Test/ on the supported PHP minors.
        run: |
          find . -name '*.php' \
            -not -path './vendor/*' \
            -not -path './node_modules/*' \
            -not -path './Test/*' \
            -print0 | xargs -0 -n1 -P4 php -l > /dev/null

  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }})
    needs: discover-magento-matrix
    runs-on: ${{ vars.RUNNER_STANDARD }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover-magento-matrix.outputs.php_lint_matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov
          # PHPUnit 10.5 supports PHP 8.1-8.4. If a future PHP minor
          # (e.g. 8.5) enters the support window and PHPUnit 10.5 has
          # not been updated to cover it, bump this pin to 11.x.
          tools: phpunit:10.5

      # The unit tests use a self-contained stub bootstrap (Test/bootstrap.php
      # + Test/Stubs/) — no Magento framework or composer install required.
      - name: Run tests with coverage
        run: phpunit --coverage-clover coverage.xml --coverage-text

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-php${{ matrix.php }}
          path: coverage.xml
          if-no-files-found: warn

  codesniffer:
    name: Codesniffer
    runs-on: ${{ vars.RUNNER_STANDARD }}
    steps:
      - uses: actions/checkout@v7
      - name: Run codesniffer
        # Pinned by digest (was `:latest`) so a new upstream coding-standard
        # release can't flip CI red with no repo change.
        # To bump: docker pull …:latest && docker inspect --format
        # '{{index .RepoDigests 0}}' …, then update the digest here.
        run: |
          docker run \
            --volume "$(pwd)/:/app/workdir" \
            michielgerritsen/magento-coding-standard@sha256:48ad208ebbda2e60be6e6c4f1abfe41e75e6339619f109dbf0581624d79e815e \
            --severity=6

  di-compile:
    name: DI compile (PHP ${{ matrix.php }}, Magento ${{ matrix.magento }})
    needs: discover-magento-matrix
    runs-on: ${{ vars.RUNNER_STANDARD }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover-magento-matrix.outputs.matrix) }}
    steps:
      # The matrix carries only runnable combos (see discover-magento-matrix),
      # so every leg here is a real test — a green leg means "tested".
      - uses: actions/checkout@v7

      - name: Start Magento docker container
        run: |
          docker run --detach --name magento-project-community-edition \
            michielgerritsen/magento-project-community-edition:${{ matrix.php_image }}-magento${{ matrix.magento }}

      - name: Upload tracked source into container
        # Ship only tracked files — avoids leaking .git/, dotfiles,
        # or any untracked working-tree state into the CI container.
        run: |
          docker exec magento-project-community-edition mkdir -p /data/extensions/magento-hyva-extension
          git ls-files -z | tar --null -cf - -T - | docker exec -i magento-project-community-edition tar -x -C /data/extensions/magento-hyva-extension

      - name: Stub Hyvä / Magewire (no commercial credentials in CI)
        # The Hyvä checkout package (hyva-themes/magento2-hyva-checkout) is
        # commercial and can't be pulled in CI without credentials. dev/stub-hyva
        # satisfies it via composer `provide` + minimal class stubs so
        # setup:di:compile exercises the module structure credential-free. This
        # is structural coverage, not a true Hyvä-integration run (TWO-24999).
        run: |
          docker exec magento-project-community-edition \
            php /data/extensions/magento-hyva-extension/dev/stub-hyva

      - name: Install extension from uploaded source
        # The Hyvä module requires the base Two plugin at the floor in
        # composer.json; composer pulls it from Packagist (public) alongside the
        # local path copy, so this leg cannot resolve until a release carrying
        # the proxy routes is published there.
        run: |
          docker exec magento-project-community-edition \
            composer config repositories.local path '/data/extensions/*'
          docker exec magento-project-community-edition \
            composer require 'two-inc/magento2-hyva-checkout:*@dev' --no-plugins

      - name: Run setup:di:compile
        run: |
          docker exec magento-project-community-edition ./retry \
            "php bin/magento module:enable Two_Gateway Two_GatewayHyva && php bin/magento setup:upgrade && php bin/magento setup:di:compile"

  # The base module's floor tracks a route set that exists on the base repo's
  # `staging` branch only — no release carries it yet (see
  # `getIsProxyAvailable()` in AGENTS.md). Release timing there is a separate,
  # unrelated decision, so this leg proves the real dependency: this branch
  # against that staging code, installed via path repo instead of Packagist.
  # This is the required gate for merge; `di-compile` above stays pointed at
  # Packagist and is expected red until a release carries the floor.
  di-compile-staging:
    name: DI compile vs base staging (PHP ${{ matrix.php }}, Magento ${{ matrix.magento }})
    needs: discover-magento-matrix
    runs-on: ${{ vars.RUNNER_STANDARD }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover-magento-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Checkout base module (staging)
        uses: actions/checkout@v7
        with:
          repository: two-inc/magento-plugin
          ref: staging
          path: base-module

      # This leg installs the base from a path repo, which Composer treats as
      # canonical: it outranks Packagist, so a branch whose `two-inc/magento2`
      # constraint excludes the version on base `staging` cannot resolve at
      # all, and the job fails on resolution rather than on anything it set
      # out to prove.
      #
      # That is the correct answer for a branch tracking the current base. It
      # is the wrong question for a MAINTENANCE release on an older major,
      # which is pinned below the base's line on purpose. Releasing 2.1.1 off
      # `main` while base `staging` is 3.x is exactly that case, and a red CI
      # run there blocks release.yml, which requires CI success.
      #
      # Caret constraints only, which is all this repo has ever used. Anything
      # else is treated as supported so an unfamiliar constraint fails loudly
      # in the job below rather than being skipped silently here.
      - name: Can this branch reach the base's staging line?
        id: compat
        env:
          # The post-merge run on `main` and nothing else. That is the only
          # run release.yml consumes, so it is the only one the skip has to
          # work for, and scoping it this tightly removes the whole class of
          # bypass: no pull request can claim release context by targeting a
          # branch or naming a head, so lowering `two-inc/magento2` to an older
          # caret major cannot mark this required gate successful without
          # compiling anything.
          #
          # Deliberately NOT `head_ref == 'staging'`. A 2.x maintenance release
          # cannot come from `staging`, because `staging` already carries the
          # next major — 2.1.1 was cut from staging's own first parent for
          # exactly that reason. Keying on the head branch would fail the
          # release this exists to unblock.
          #
          # The cost is that a release PR shows these legs red before merge.
          # They gate nothing (no required status checks on `main`) and the
          # red is honest: on that tree the compile genuinely cannot resolve.
          RELEASE_CONTEXT: >-
            ${{ github.event_name == 'push' && github.ref_name == 'main' }}
        run: |
          set -euo pipefail
          constraint=$(jq -r '.require["two-inc/magento2"] // ""' composer.json)
          base_version=$(sed -n 's/^current_version = "\([^"]*\)"/\1/p' base-module/bumpver.toml)
          echo "constraint=${constraint} base=${base_version}"

          # Fail closed. `sed` exits 0 with no output if the file is gone or
          # the line is reformatted, and an empty base version would compare
          # unequal to any constraint, marking this gate green without
          # compiling anything — the check silently disabling itself.
          if ! printf '%s' "$base_version" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "::error::Could not read a version from base-module/bumpver.toml (got '${base_version}'). Refusing to decide whether this gate applies."
            exit 1
          fi
          base_major=${base_version%%.*}

          # A COMPLETE single-caret constraint and nothing else. Matching a
          # `^` prefix alone would read `^2.3 || ^3.0` as major 2 and skip,
          # although Composer reads the `||` as OR and accepts base 3.x — so
          # the gate would go green exactly when the compatible base is the
          # thing that needs compiling. Anything this does not recognise is
          # treated as supported and proceeds to the compile below, where an
          # unfamiliar constraint fails loudly instead of silently here.
          # The whole VALUE must be a single-caret constraint, evaluated as one
          # record. `grep` is line-oriented and succeeds if ANY line matches,
          # so a constraint carrying an embedded newline — `"^2.3\n|| ^3.0"`,
          # which jq decodes and Composer accepts — would match on its first
          # line and skip, although its `^3.0` arm is compatible. Reject a
          # multiline value outright before the match.
          if [ "$(printf '%s' "$constraint" | wc -l | tr -d ' ')" != "0" ]; then
            want_major=""
          elif printf '%s' "$constraint" | grep -Eq '^\^[0-9]+(\.[0-9]+)*$'; then
            stripped="${constraint#^}"
            want_major="${stripped%%.*}"
          else
            want_major=""
          fi

          # Directional on purpose. Only an OLDER major is the maintenance
          # case this skip exists for. A branch that has moved AHEAD of base
          # staging — say it wants ^4.0 while staging is 3.x — genuinely
          # cannot compile against the base it is meant to track, and that has
          # to stay red rather than be waved through as skipped-success.
          # Outside the post-merge `main` run there is no skip, whatever the
          # versions say. Fall through and let the compile fail on its own
          # resolution error rather than inventing a different failure.
          if [ "${RELEASE_CONTEXT}" != "true" ]; then
            want_major=""
          fi

          if [ -n "$want_major" ] && [ "$want_major" -lt "$base_major" ]; then
            echo "::notice::Skipping: this branch requires two-inc/magento2 ${constraint}, base staging is ${base_version}. A branch on an older major cannot resolve against it, by design."
            echo "supported=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "supported=true" >> "$GITHUB_OUTPUT"

      - name: Start Magento docker container
        if: steps.compat.outputs.supported == 'true'
        run: |
          docker run --detach --name magento-project-community-edition \
            michielgerritsen/magento-project-community-edition:${{ matrix.php_image }}-magento${{ matrix.magento }}

      - name: Upload tracked source into container
        if: steps.compat.outputs.supported == 'true'
        # Ship only tracked files — avoids leaking .git/, dotfiles,
        # or any untracked working-tree state into the CI container.
        run: |
          docker exec magento-project-community-edition mkdir -p /data/extensions/magento-hyva-extension
          git ls-files -z | tar --null -cf - -T - | docker exec -i magento-project-community-edition tar -x -C /data/extensions/magento-hyva-extension

      - name: Upload base module source into container
        if: steps.compat.outputs.supported == 'true'
        run: |
          docker exec magento-project-community-edition mkdir -p /data/extensions/two-magento2
          git -C base-module ls-files -z | tar --null -cf - -C base-module -T - | docker exec -i magento-project-community-edition tar -x -C /data/extensions/two-magento2

      - name: Stub Hyvä / Magewire (no commercial credentials in CI)
        if: steps.compat.outputs.supported == 'true'
        # The Hyvä checkout package (hyva-themes/magento2-hyva-checkout) is
        # commercial and can't be pulled in CI without credentials. dev/stub-hyva
        # satisfies it via composer `provide` + minimal class stubs so
        # setup:di:compile exercises the module structure credential-free. This
        # is structural coverage, not a true Hyvä-integration run (TWO-24999).
        run: |
          docker exec magento-project-community-edition \
            php /data/extensions/magento-hyva-extension/dev/stub-hyva

      - name: Install extension from uploaded source
        if: steps.compat.outputs.supported == 'true'
        # Base module is registered by its own key, ahead of requiring this
        # module, so composer resolves the transitive `two-inc/magento2`
        # requirement against the uploaded staging source instead of Packagist.
        run: |
          docker exec magento-project-community-edition \
            composer config repositories.two-magento2 path /data/extensions/two-magento2
          docker exec magento-project-community-edition \
            composer config repositories.local path '/data/extensions/magento-hyva-extension'
          docker exec magento-project-community-edition \
            composer require 'two-inc/magento2-hyva-checkout:*@dev' --no-plugins

      - name: Run setup:di:compile
        if: steps.compat.outputs.supported == 'true'
        run: |
          docker exec magento-project-community-edition ./retry \
            "php bin/magento module:enable Two_Gateway Two_GatewayHyva && php bin/magento setup:upgrade && php bin/magento setup:di:compile"

  # A real gate, deliberately not continue-on-error and not conditional
  # (TWO-25245). The company-search defects this suite pins — the magewire
  # overlay latching on forever after "type three characters then backspace", a
  # timeout rendering as "no companies found", a superseded response
  # repopulating the dropdown — are all invisible to the PHPUnit suites, which
  # never execute the templates' inline JS. An advisory job would have caught
  # none of them.
  jest:
    name: Jest (Node 20)
    runs-on: ${{ vars.RUNNER_STANDARD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci --no-audit --no-fund
      - run: npm run test:js

  # NOTE: no `prettier --check` gate. It was considered (TWO-24999) but
  # deferred: the tree is not currently prettier-clean (23 files), so the gate
  # would require a repo-wide `prettier --write` reformat first — a separate
  # formatting decision, tracked out of this CI-enablement change.
