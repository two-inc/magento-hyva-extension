name: Version current

# Required check on `staging` (ISEC-853). Fails until the PR head carries the
# version decide-bump-level.sh computes for it, so a PR cannot merge before its
# version bump lands. The bump itself is pushed by "Version bump", which runs
# after this workflow completes and reads its code from `staging`.
#
# Read-only: no secrets and no App token, so it is safe on any PR, forks
# included. The computation runs `staging`'s copy of the script (in `trusted/`)
# over the PR head's git history (in `pr/`), the same as "Version bump" does,
# so a PR cannot make this pass by editing the script. Fork PRs get no automated
# bump; the error names the version to set by hand.
#
# The required-check setting applies to every protected branch that requires a
# PR, so this also triggers on PRs into `main` and `release` and skips there at
# job level (a skipped job counts as passing). Merge-back PRs (`main` into
# `staging`) skip the same way: they carry a version already decided.
on:
  pull_request:
    branches: [staging, main, release]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  version-current:
    name: version-current
    runs-on: ${{ vars.RUNNER_STANDARD }}
    timeout-minutes: 10
    if: >-
      github.base_ref == 'staging' &&
      !(github.event.pull_request.head.repo.full_name == github.repository &&
        (github.head_ref == 'main' || github.head_ref == 'staging'))
    steps:
      - name: Check out staging (the code this job runs)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false

      - name: Test the version computation
        working-directory: trusted
        run: .github/scripts/test-decide-bump-level.sh

      - name: Check out the PR head (data only)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch main and staging
        working-directory: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/staging:refs/remotes/origin/staging"

      - name: Compute the version
        id: decide
        working-directory: pr
        run: ../trusted/.github/scripts/decide-bump-level.sh origin/staging HEAD
      - name: The PR head must carry the computed version
        env:
          SET_VERSION: ${{ steps.decide.outputs.set_version }}
          CHANGED: ${{ steps.decide.outputs.changed }}
          REASON: ${{ steps.decide.outputs.reason }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$CHANGED" != "true" ]; then
            echo "Version is ${SET_VERSION}: ${REASON}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then
            echo "::error::Version bump pending: this PR should land as ${SET_VERSION} (${REASON}). \"Version bump\" pushes that commit onto the branch after this check; it re-runs and passes then."
          else
            echo "::error::This PR should land as ${SET_VERSION} (${REASON}). Fork PRs get no automated bump: run bumpver update --set-version ${SET_VERSION} --no-tag-commit --no-push and push the commit."
          fi
          exit 1
