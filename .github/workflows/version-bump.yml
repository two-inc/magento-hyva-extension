name: Version bump

# Commits the version a pull request should land on `staging` with onto the
# PR's own head branch. The version scheme is TWO-25256's: it describes the
# CHANGE, from the conventional-commit types of the commits the PR adds, and
# .github/scripts/decide-bump-level.sh owns the whole decision. See README for
# the rules.
#
# WHY workflow_run (ISEC-853). This workflow used to run on `pull_request`,
# which reads the workflow file from the PR head: any same-repo PR could edit
# the job and take the org App token it mints (PLAT-2318). A `workflow_run`
# workflow is always read from the default branch (`staging`), so the PR cannot
# change what runs here. It also runs no code from the PR head:
#
#   - decide-bump-level.sh and its tests come from the `staging` checkout in
#     `trusted/`; the PR head is checked out in `pr/` and only read as git data;
#   - bumpver only rewrites the files bumpver.toml lists, and the job refuses a
#     PR whose bumpver.toml differs from `staging`'s beyond `current_version`,
#     so a PR cannot add hooks or retarget it;
#   - commit messages reach the script through git, never through `${{ }}`.
#
# The App token is minted only for the final push, and only when a bump is due.
# Its key is read from Secret Manager by gha-app-key-reader, which is bound to
# exactly this file on `staging` (infra two-artifacts app-key.tf).
#
# WHEN. It runs after "Version current" completes on a PR. That check is
# required on `staging` and fails until the PR head carries the version this
# workflow computes, so a PR cannot merge before its bump lands. The bump
# commit is pushed with the App token, which triggers CI on it again; the second
# pass finds the version already correct and writes nothing.
#
# TOKEN: the org App, not GITHUB_TOKEN, because pushes made with GITHUB_TOKEN
# do not trigger workflows, so CI and "Version current" would never re-run on
# the bump commit.
on:
  workflow_run:
    workflows: [Version current]
    types: [completed]

permissions:
  contents: read

# Never cancel in flight: a cancelled run could be killed between the bump
# commit and the push. One queue per PR branch.
concurrency:
  group: version-bump-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  bump:
    name: Compute version for this PR
    runs-on: ${{ vars.RUNNER_STANDARD }}
    timeout-minutes: 10
    # A PR into `staging` from a branch of THIS repo. Fork PRs have nowhere to
    # be pushed to; their "Version current" check names the version to set by
    # hand. `staging` and `main` heads are promotion and merge-back PRs, which
    # carry versions already decided.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch != 'staging' &&
      github.event.workflow_run.head_branch != 'main' &&
      github.event.workflow_run.pull_requests[0].base.ref == 'staging'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out staging (the code this job runs)
        uses: actions/checkout@v6
        with:
          ref: staging
          path: trusted
          persist-credentials: false

      - name: Test the version computation
        working-directory: trusted
        run: .github/scripts/test-decide-bump-level.sh

      - name: Check out the PR head (data only)
        uses: actions/checkout@v6
        with:
          # The head BRANCH, so HEAD is its tip and the bump commit lands on it.
          ref: ${{ github.event.workflow_run.head_branch }}
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - name: Skip if the branch has moved on
        id: current
        working-directory: pr
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$RUN_SHA" ]; then
            echo "::notice::The branch moved past ${RUN_SHA}; the run for its new head decides instead."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch main and staging
        if: steps.current.outputs.stale == 'false'
        working-directory: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/staging:refs/remotes/origin/staging"

      - name: Refuse a changed bumpver.toml
        if: steps.current.outputs.stale == 'false'
        run: |
          set -euo pipefail
          strip() { sed '/^[[:space:]]*current_version[[:space:]]*=/d' "$1"; }
          if ! diff <(strip trusted/bumpver.toml) <(strip pr/bumpver.toml) >/dev/null; then
            echo "::error::This PR changes bumpver.toml beyond current_version, so the bump is not automated. Land the bumpver.toml change on its own and set the version by hand, as \"Version current\" names it."
            exit 1
          fi

      - name: Compute the version
        if: steps.current.outputs.stale == 'false'
        id: decide
        working-directory: pr
        run: ../trusted/.github/scripts/decide-bump-level.sh origin/staging HEAD
      - uses: actions/setup-python@v6
        if: steps.decide.outputs.changed == 'true'
        with:
          python-version: "3.12"

      - name: Install bumpver
        if: steps.decide.outputs.changed == 'true'
        working-directory: trusted
        run: pip install bumpver

      - name: Configure git identity
        if: steps.decide.outputs.changed == 'true'
        working-directory: pr
        env:
          APP_ID: ${{ vars.TWO_INC_APP_ID }}
        run: |
          git config user.name "two-inc-app[bot]"
          git config user.email "${APP_ID}+two-inc-app[bot]@users.noreply.github.com"

      - name: Write the version (files + commit only)
        if: steps.decide.outputs.changed == 'true'
        working-directory: pr
        env:
          SET_VERSION: ${{ steps.decide.outputs.set_version }}
        run: |
          set -euo pipefail
          # --set-version because the script hands over an absolute version.
          # --no-tag-commit --no-push: tags belong to `main` and the push is
          # done explicitly below. --no-fetch: this checkout carries no
          # credential, and nothing here creates a tag for a fetch to protect.
          bumpver update --set-version "$SET_VERSION" --no-tag-commit --no-push --no-fetch

      - name: Mint GitHub App token
        id: app-token
        if: steps.decide.outputs.changed == 'true'
        uses: two-inc/actions-public/app-token@main
        with:
          client-id: ${{ vars.TWO_INC_APP_CLIENT_ID }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Push onto the PR branch
        if: steps.decide.outputs.changed == 'true'
        working-directory: pr
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_REF: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          [ -n "$TOKEN" ] || { echo "::error::No App token: the key could not be read from Secret Manager."; exit 1; }
          # A plain push is fast-forward only: if the branch moved since the
          # check above, it is refused and the run for the new head decides.
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" "HEAD:refs/heads/${HEAD_REF}"

      - name: Summary
        if: steps.current.outputs.stale == 'false'
        env:
          SET_VERSION: ${{ steps.decide.outputs.set_version }}
          CHANGED: ${{ steps.decide.outputs.changed }}
          REASON: ${{ steps.decide.outputs.reason }}
        run: |
          if [ "$CHANGED" = "true" ]; then
            echo "Version set to ${SET_VERSION}: ${REASON}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Version already correct at ${SET_VERSION}: ${REASON}" >> "$GITHUB_STEP_SUMMARY"
          fi
